{% extends "base.html" %}
{% block title %}{{ _('Роли сотрудника') }}{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', path='css/member_roles.css') }}">
{% endblock %}

{% block content %}
<div class="page">
<div class="sticky-head">
    <div class="page-inner">
      <div class="head-row">
        <div class="head-title">
          <h2>{{ m.full_name }}</h2>
          <div class="sub">{{ _('ИИН:') }} {{ m.iin }} {{ _('· Назначения в должность в администрации школы') }}</div>
        </div>
        <div class="head-actions">
          <a class="btn btn--ghost" href="/staff/school" data-sm-action="nav" data-sm-back="true">{{ _('← Назад') }}</a>
        </div>
      </div>
    </div>
  </div>


  <div class="page-inner">
<form method="post" action="/staff/school/members/{{ m.id }}/roles" id="rolesForm">
  <div class="card section">
    <div id="rolesBox"></div>
    <div id="rolesHidden"></div>
  </div>

  <div class="form-actions">
    <button class="btn btn--ghost" type="button" onclick="addRoleRow()" data-sm-action="primary">{{ _('+ Добавить роль') }}</button>
    <button class="btn btn--primary" type="submit" data-sm-action="primary">{{ _('Сохранить') }}</button>
  </div>
</form>
  </div>
</div>

<script>
  const ROLES = {{ staff_role_options(responsible_roles)|tojson }};
  const EXISTING = {{ member_roles|tojson }};

  function escapeRoleText(value) {
    return String(value).replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
  }

  function roleRowHtml(idx, roleVal="", ctxVal=""){
    const options = ROLES.map(r => {
      const sel = r.value === roleVal ? "selected" : "";
      return `<option value="${r.value}" ${sel}>${r.label_kz}</option>`;
    }).join("");

    return window.SchoolMonitorI18n.t("st_874a9eb095ab", {p0: (idx), p1: (options), p2: (escapeRoleText(ctxVal || "")), p3: (idx)})   ;
  }

  function addRoleRow(roleVal="", ctxVal=""){
    const box = document.getElementById("rolesBox");
    const idx = box.querySelectorAll(".role-row").length;
    box.insertAdjacentHTML("beforeend", roleRowHtml(idx, roleVal, ctxVal));
  }

  function removeRoleRow(idx){
    const row = document.querySelector(`.role-row[data-idx="${idx}"]`);
    if(row) row.remove();
    renumber();
  }

  function renumber(){
    const rows = Array.from(document.querySelectorAll("#rolesBox .role-row"));
    rows.forEach((row, i) => {
      row.dataset.idx = String(i);
      const btn = row.querySelector("button[type='button']");
      if(btn) btn.setAttribute("onclick", `removeRoleRow(${i})`);
    });
  }

  function buildHidden(){
    const hidden = document.getElementById("rolesHidden");
    hidden.innerHTML = "";
    const rows = Array.from(document.querySelectorAll("#rolesBox .role-row"));
    let j = 0;
    for(const row of rows){
      const role = (row.querySelector(".rr-role")?.value || "").trim();
      const ctx = (row.querySelector(".rr-context")?.value || "").trim();
      if(!role) continue;

      const a = document.createElement("input");
      a.type="hidden"; a.name=`roles[${j}].role`; a.value=role;
      hidden.appendChild(a);

      const b = document.createElement("input");
      b.type="hidden"; b.name=`roles[${j}].context`; b.value=ctx;
      hidden.appendChild(b);

      j++;
    }
  }

  document.addEventListener("DOMContentLoaded", () => {
    if(EXISTING && EXISTING.length){
      EXISTING.forEach(r => addRoleRow(r.role, r.context));
    } else {
      addRoleRow();
    }
    document.getElementById("rolesForm").addEventListener("submit", () => buildHidden());
  });
</script>
{% endblock %}
