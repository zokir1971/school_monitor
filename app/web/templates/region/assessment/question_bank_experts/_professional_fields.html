<div class="row g-3">

  <!-- POSITION -->

  <div class="col-md-6">

    <label
      for="position_text"
      class="form-label"
    >
      {{ _('Лауазымы') }}
    </label>

    <input
      id="position_text"
      name="position_text"
      type="text"
      class="form-control"
      value="{{
        form.position_text or ''
        if form is defined
        else ''
      }}"
      maxlength="255"
    >

  </div>


  <!-- QUALIFICATION CATEGORY -->

  <div class="col-md-6">

    <label
      for="qualification_category_text"
      class="form-label"
    >
      {{ _('Біліктілік санаты') }}
    </label>

    {% set selected_category =
      form.qualification_category_text
      if form is defined
      else ''
    %}

    <select
      id="qualification_category_text"
      name="qualification_category_text"
      class="form-select"
    >

      <option value="">
        {{ _('Санатты таңдаңыз') }}
      </option>

      {% if selected_category == 'педагог' %}
        <option value="педагог" selected>
          {{ _('Педагог') }}
        </option>
      {% else %}
        <option value="педагог">
          {{ _('Педагог') }}
        </option>
      {% endif %}

      {% if selected_category == 'педагог-модератор' %}
        <option value="педагог-модератор" selected>
          {{ _('Педагог-модератор') }}
        </option>
      {% else %}
        <option value="педагог-модератор">
          {{ _('Педагог-модератор') }}
        </option>
      {% endif %}

      {% if selected_category == 'педагог-сарапшы' %}
        <option value="педагог-сарапшы" selected>
          {{ _('Педагог-сарапшы') }}
        </option>
      {% else %}
        <option value="педагог-сарапшы">
          {{ _('Педагог-сарапшы') }}
        </option>
      {% endif %}

      {% if selected_category == 'педагог-зерттеуші' %}
        <option value="педагог-зерттеуші" selected>
          {{ _('Педагог-зерттеуші') }}
        </option>
      {% else %}
        <option value="педагог-зерттеуші">
          {{ _('Педагог-зерттеуші') }}
        </option>
      {% endif %}

      {% if selected_category == 'педагог-шебер' %}
        <option value="педагог-шебер" selected>
          {{ _('Педагог-шебер') }}
        </option>
      {% else %}
        <option value="педагог-шебер">
          {{ _('Педагог-шебер') }}
        </option>
      {% endif %}

    </select>

  </div>


  <!-- EDUCATION -->

  <div class="col-md-6">

    <label
      for="education_text_display"
      class="form-label"
    >
      {{ _('Білімі') }}
    </label>

    <input
      id="education_text_display"
      type="text"
      class="form-control"
      value="{{ expert_standard_label('Жоғары') }}"
      readonly
    >

    <input
      type="hidden"
      name="education_text"
      value="Жоғары"
    >

  </div>


  <!-- SPECIALTY -->

  <div class="col-md-6">

    <label
      for="specialty_text"
      class="form-label"
    >
      {{ _('Мамандығы') }}
    </label>

    {% set selected_specialty =
      form.specialty_text
      if form is defined
      else ''
    %}

    <select
      id="specialty_text"
      name="specialty_text"
      class="form-select"
    >

      <option value="">
        {{ _('Мамандығын таңдаңыз') }}
      </option>

      {% for subject in options.subjects %}

        {% if selected_specialty == subject.name %}

          <option
            value="{{ subject.name }}"
            selected
          >
            {{ subject.name }}
          </option>

        {% else %}

          <option value="{{ subject.name }}">
            {{ subject.name }}
          </option>

        {% endif %}

      {% endfor %}

    </select>

  </div>


  <!-- EXPERIENCE -->

  <div class="col-md-4">

    <label
      for="ped_experience_years"
      class="form-label"
    >
      {{ _('Педагогикалық өтілі') }}
    </label>

    <div class="qb-experience-field">
      <input
        id="ped_experience_years"
        name="ped_experience_years"
        type="number"
        class="form-control"
        value="{{
          form.ped_experience_years
          if
            form is defined
            and form.ped_experience_years is not none
          else ''
        }}"
        min="0"
        step="1"
      >

      <span class="qb-experience-unit">
        {{ _('жыл') }}
      </span>
    </div>

  </div>

</div>
