<form method="get" action="{{ url_for('teacher_question_bank_items_page') }}" class="qb-items-filters">
  {% if page.selected_status %}<input type="hidden" name="status" value="{{ page.selected_status.value }}">{% endif %}
  <label class="qb-items-filters__search">{{ _('Поиск') }}<input type="search" name="q" maxlength="200" value="{{ filters.get('q','') }}" placeholder="{{ _('Текст, номер задания или код учебной цели') }}"></label>
  <label>{{ _('Предмет') }}<select name="subject_id"><option value="">{{ _('Все') }}</option>{% for subject in subject_filters %}<option value="{{ subject.id }}" {% if filters.get('subject_id')==subject.id %}selected{% endif %}>{{ assessment_subject_name(subject) }}</option>{% endfor %}</select></label>
  <label>{{ _('Класс') }}<select name="grade_level"><option value="">{{ _('Все') }}</option>{% for grade in range(1,13) %}<option value="{{ grade }}" {% if filters.get('grade_level')==grade %}selected{% endif %}>{{ grade }}</option>{% endfor %}</select></label>
  <label>{{ _('Четверть') }}<select name="quarter"><option value="">{{ _('Все') }}</option>{% for quarter in range(1,5) %}<option value="{{ quarter }}" {% if filters.get('quarter')==quarter %}selected{% endif %}>{{ quarter }}</option>{% endfor %}</select></label>
  <label>{{ _('Тапсырма түрі') }}<select name="question_type"><option value="">{{ _('Все') }}</option>{% for kind in filter_types %}<option value="{{ kind.value }}" {% if filters.get('question_type')==kind.value %}selected{% endif %}>{{ _(kind.label_kz) }}</option>{% endfor %}</select></label>
  <label>{{ _('Күрделілік') }}<select name="difficulty"><option value="">{{ _('Все') }}</option>{% for level in filter_difficulties %}<option value="{{ level.value }}" {% if filters.get('difficulty')==level.value %}selected{% endif %}>{{ _(level.label_kz) }}</option>{% endfor %}</select></label>
  <label>{{ _('Исходный язык') }}<select name="language"><option value="">{{ _('Все') }}</option>{% for language in filter_languages %}<option value="{{ language.value }}" {% if filters.get('language')==language.value %}selected{% endif %}>{{ _(language.label_kz) }}</option>{% endfor %}</select></label>
  <label>{{ _('Жасалу тәсілі') }}<select name="origin"><option value="">{{ _('Все') }}</option>{% for code,label in [('manual','Қолмен'),('ai_generated','AI'),('imported','Импорт')] %}<option value="{{ code }}" {% if filters.get('origin')==code %}selected{% endif %}>{{ _(label) }}</option>{% endfor %}</select></label>
  <div class="qb-items-filters__actions"><button type="submit" data-sm-action="primary">{{ _('Найти') }}</button><a href="{{ url_for('teacher_question_bank_items_page') }}" data-sm-action="nav">{{ _('Сбросить') }}</a></div>
</form>
