<div
  id="qb-math-dialog"
  class="qb-math-dialog"
  hidden
>

  <!-- BACKDROP -->
  <div
    class="qb-math-dialog__backdrop"
    data-math-dialog-cancel
  ></div>


  <!-- PANEL -->
  <div
    class="qb-math-dialog__panel"
    role="dialog"
    aria-modal="true"
    aria-labelledby="qb-math-dialog-title"
  >

    <!-- HEADER -->
    <div class="qb-math-dialog__header">

      <h3 id="qb-math-dialog-title">
        {{ _('Формула енгізу') }}
      </h3>

      <button
        type="button"
        class="qb-math-dialog__close"
        data-math-dialog-close
        aria-label="{{ _('Жабу') }}"
       data-sm-action="nav" data-sm-size="compact" data-sm-icon="true">
        ×
      </button>

    </div>


    <!-- BODY -->
    <div class="qb-math-dialog__body">

      <!-- =========================================
           EXTRA MATH SYMBOLS
           ========================================= -->

      <div class="qb-math-tools">

        <div class="qb-math-tools__label">
          {{ _('Қосымша таңбалар') }}
        </div>

        <div class="qb-math-tools__buttons">

          <!-- Нижний индекс -->
          <button
            type="button"
            class="qb-math-tools__button"
            data-math-action="subscript"
            title="{{ _('Төменгі индекс') }}"
           data-sm-action="nav" data-sm-size="compact">
            x<sub>n</sub>
          </button>
          <!-- Математическая дробь -->
          <button
            type="button"
            class="qb-math-tools__button"
            data-math-action="fraction"
            title="{{ _('Бөлшек') }}"
           data-sm-action="nav" data-sm-size="compact">
            <span class="qb-math-tools__fraction">
              <span>a /</span>
              <span>b</span>
            </span>
          </button>

          <!-- Плюс-минус -->
          <button
            type="button"
            class="qb-math-tools__button"
            data-math-insert="\pm"
            title="{{ _('Плюс-минус') }}"
           data-sm-action="nav" data-sm-size="compact">
            ±
          </button>

          <!-- Не равно -->
          <button
            type="button"
            class="qb-math-tools__button"
            data-math-insert="\ne"
            title="{{ _('Тең емес') }}"
           data-sm-action="nav" data-sm-size="compact">
            ≠
          </button>

          <!-- Меньше или равно -->
          <button
            type="button"
            class="qb-math-tools__button"
            data-math-insert="\le"
            title="{{ _('Кіші немесе тең') }}"
           data-sm-action="nav" data-sm-size="compact">
            ≤
          </button>

          <!-- Больше или равно -->
          <button
            type="button"
            class="qb-math-tools__button"
            data-math-insert="\ge"
            title="{{ _('Үлкен немесе тең') }}"
           data-sm-action="nav" data-sm-size="compact">
            ≥
          </button>

          <!-- Pi -->
          <button
            type="button"
            class="qb-math-tools__button"
            data-math-insert="\pi"
            title="{{ _('Пи саны') }}"
           data-sm-action="nav" data-sm-size="compact">
            π
          </button>

          <button
            type="button"
            class="qb-math-tools__button"
            data-math-insert="\varnothing"
            title="{{ _('Бос жиын / Пустое множество') }}"
           data-sm-action="nav" data-sm-size="compact">
            ∅
          </button>

        </div>

      </div>


      <!-- =========================================
           MATHLIVE FIELD
           ========================================= -->

      <math-field
        id="qb-math-field"
        class="qb-math-field"
        math-virtual-keyboard-policy="auto"
      ></math-field>

    </div>


    <!-- ACTIONS -->
    <div class="qb-math-dialog__actions">

      <button
        type="button"
        class="qb-btn qb-btn--secondary"
        data-math-dialog-cancel
       data-sm-action="edit">
        {{ _('Болдырмау') }}
      </button>

      <button
        type="button"
        class="qb-btn qb-btn--primary"
        data-math-dialog-save
       data-sm-action="primary">
        {{ _('Қосу') }}
      </button>

    </div>

  </div>

</div>
